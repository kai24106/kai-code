<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>岐阜県のおすすめスポット</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: red;
      background-color: skyblue;
      padding-bottom: 120px;
    }

    header {
      background-color: #440000;
      color: red;
      padding: 24px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      color: red;
    }

    section {
      background-color: skyblue;
      color: red;
      padding: 24px;
      margin-bottom: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    section h2 {
      margin-top: 0;
      color: red;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #440000;
      color: red;
      padding: 18px;
      text-align: center;
    }

    footer p {
      margin: 5px 0;
    }

    footer a {
      color: red;
      text-decoration: none;
      margin: 0 8px;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <h1>岐阜県のおすすめスポットのWebサイト</h1>
  </header>

  <main>
    <section>
      <h2>おすすめスポットについて</h2>
      <p>
        これはHTMLとCSSだけで作成したシンプルなWebサイトです。
        シンプルで見やすいデザインを目指しています。
      </p>
      <img src="https://github.com/kai24106/kai-code/blob/main/cupcake.jpg?raw=true" alt="サンプル">
    </section>

    <section>
      <h2>時間・場所</h2>
      <p>
        この場所にサービスの紹介や、お知らせ、プロフィールなどの
        コンテンツを掲載できます。
      </p>
    </section>
  </main>

  <footer>
    <p>お問い合わせ：example@example.com</p>
    <p>
      <a href="https://twitter.com/" target="_blank">X</a>
      <a href="https://www.instagram.com/" target="_blank">Instagram</a>
      <a href="https://www.facebook.com/" target="_blank">Facebook</a>
    </p>
  </footer>

</body>
</html>
